<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://d1bxh8uas1mnw7.cloudfront.net" crossorigin>

<!-- tsParticles (46 KB compressed) is not loaded here: the home page background loads it only when #about exists and the
     visitor has not asked for reduced motion (see PARTICLE BACKGROUND below). -->

<!-- Typed.js for terminal typing effect (defer: init runs on DOMContentLoaded) -->

<!-- Altmetric Badge Script for publication pages -->
<script defer type="text/javascript" src="https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js"></script>

<!-- Dimensions Badge Script - loaded dynamically by shortcode -->

<!-- Shared publications.json cache — single fetch for all shortcodes -->

<!-- Custom Animations & Enhancements -->

<!-- JavaScript for Interactive Animations -->
