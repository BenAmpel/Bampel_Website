<!-- Google Analytics is emitted by the Wowchemy analytics config; not duplicated here. -->
<!-- Google AdSense intentionally disabled per site owner preference. -->

<!-- The home page background is CSS (#about::before in assets/css/head-inline.css); no particle script loads. -->

<!-- Altmetric and Dimensions badge scripts are loaded by their shortcodes, only on the pages that show a badge. -->

<!-- Shared publications.json cache — single fetch for all shortcodes -->
{{ partial "functions/js_tag" (dict "path" "js/site/pub-loader.js") }}


<meta name="build-date" content="{{ now.UTC.Format "2006-01-02" }}">

<!-- Custom Animations & Enhancements -->
{{ $headCSS := resources.Get "css/head-inline.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $headCSS.RelPermalink }}" integrity="{{ $headCSS.Data.Integrity }}">

<!-- JavaScript for Interactive Animations -->
{{ $headJS := resources.Get "js/head-enhancements.js" | minify | fingerprint }}
<script defer src="{{ $headJS.RelPermalink }}" integrity="{{ $headJS.Data.Integrity }}"></script>
