# Weekly update pull requests for the build's npm packages and for the GitHub Actions the workflows use (pinned by
# commit). Hugo and Dart Sass are pinned in netlify.toml, which Dependabot cannot read; .github/workflows/version-watch.yml
# covers them. There is no theme to update: the Wowchemy v5 files the site uses were copied into the repository in
# October 2026 (docs/superpowers/plans/2026-10-25-theme-migration.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      build-tools:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
