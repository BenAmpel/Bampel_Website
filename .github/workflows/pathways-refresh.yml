name: Pathway Finder data refresh

# Refreshes the labor-market figures in static/ccair/data/pathways.json and opens a pull request for review.
# It never pushes to main and never asks for an immediate deploy: the merged change goes out with the next
# scheduled bampel.com build.

on:
  schedule:
    # 10th of each month, 14:00 UTC: after the BLS Employment Situation release (usually the first Friday)
    - cron: '0 14 10 * *'
  workflow_dispatch:

concurrency:
  group: pathways-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the refresh branch (never main)
      pull-requests: write   # open or update the pull request
    env:
      BRANCH: data/pathways-refresh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Refresh data
        id: refresh
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: |
          set -u
          node scripts/refresh-pathways-data.mjs --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- static/ccair/data/pathways.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the pages still build
        run: npm run build:ccair

      - name: Open or update the pull request
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          case "$BRANCH" in main|master|"") echo "refusing to push to $BRANCH"; exit 1 ;; esac
          month=$(date -u +%Y-%m)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add static/ccair/data/pathways.json
          git commit -m "Pathway Finder: refresh labor-market data ($month)"
          # One rolling branch: a newer run replaces an unmerged older one
          git push --force origin "HEAD:refs/heads/$BRANCH"
          title="Pathway Finder: refresh labor-market data ($month)"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/summary.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/summary.md"
          fi
