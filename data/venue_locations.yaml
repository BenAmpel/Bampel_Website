# Venue gazetteer for the interactive Research Footprint map.
#
# scripts/build_dashboard_payload.py matches each conference/workshop entry in
# publications.json against these rules (case-insensitive substring on the
# venue field; FIRST match wins, so keep specific aliases above generic ones)
# and emits a map point automatically. When a new paper is added at a known
# venue+year it appears on the map with no other edits. An unmatched
# venue+year prints a build warning — add a rule here to place it.
#
# skip: true silences the warning for virtual events and preprints.

# --- specific aliases first ---
- match: "AI4Cyber-KDD"
  year: 2021
  skip: true            # KDD 2021 workshop was virtual
- match: "ICIS TREO"
  year: 2025
  name: "Pre-ICIS Workshops 2025"
  city: "Nashville, TN"
  lat: 36.1627
  lng: -86.7816
- match: "WISP"
  year: 2025
  name: "Pre-ICIS Workshops 2025"
  city: "Nashville, TN"
  lat: 36.1627
  lng: -86.7816
- match: "SIG Services"
  year: 2025
  name: "Pre-ICIS Workshops 2025"
  city: "Nashville, TN"
  lat: 36.1627
  lng: -86.7816
- match: "arXiv"
  skip: true            # preprints have no venue location

