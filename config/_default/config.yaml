# Configuration of Hugo
# Guide: https://wowchemy.com/docs/getting-started/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

title: Benjamin M. Ampel # Website name
baseURL: 'https://bampel.com/' # Website URL

# Render future-dated content (accepted papers listed before their conference dates)
buildFuture: true

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## MODULES
############################

# The site owns its theme: the Wowchemy v5 templates, styles and scripts it uses were copied into layouts/, assets/,
# data/ and static/ in October 2026 (from Wowchemy v5 commit 59b6487, MIT; see docs/superpowers/plans/
# 2026-10-25-theme-migration.md), so the build fetches no theme module.
module:
  # The project's own folders (Hugo's defaults, which a mounts list replaces), plus static/images mounted into assets/ as
  # well, so templates can make WebP versions of the map PNGs that scripts/generate_map.py rewrites each month, and the
  # site's SEO templates (modules/wowchemy-seo), mounted after layouts/ so the site's own files win.
  mounts:
    - { source: content, target: content }
    - { source: data, target: data }
    - { source: layouts, target: layouts }
    - { source: i18n, target: i18n }
    - { source: archetypes, target: archetypes }
    - { source: assets, target: assets }
    # The coauthor-network and impact-dashboard PNGs (about 1.2 MB) are written by the metrics scripts but shown nowhere.
    - { source: static, target: static, files: ["! images/coauthor-network*.png", "! images/impact-dashboard*.png"] }
    - { source: static/images, target: assets/images }
    - { source: modules/wowchemy-seo/layouts, target: layouts }
    - { source: modules/wowchemy-seo/assets, target: assets }

############################
## ADVANCED
############################

# hugo_stats.json (tags, classes and ids of the rendered pages) feeds the unused-CSS pass; see postcss.config.js.
build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'hugo_stats\.json'
      target: 'css'
    - source: 'postcss\.config\.js'
      target: 'css'

enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [\.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$]
permalinks:
  event: '/talk/:slug/'
  tags: '/tag/:slug/'
  categories: '/category/:slug/'
  publication_types: '/publication-type/:slug/'
disableAliases: true
outputs:
  home: [HTML, RSS, JSON, WebAppManifest, headers, redirects]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  jpeg:
    quality: 100
  webp:
    quality: 100
  anchor: smart
timeout: 600000
taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
  author: authors
markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
  highlight:
    codeFences: true
    noHl: false
    lineNumbersInTable: false
    noClasses: false
    guessSyntax: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70
# Templates may read HUGO_* and WC_* environment variables (WC_PURGE_CSS switches on the unused-CSS pass).
security:
  funcs:
    getenv:
      - ^HUGO_
      - ^WC_
sitemap:
  changefreq: weekly
minify:
  tdewolff:
    html:
      keepComments: true
# The Netlify _headers and _redirects files (layouts/index.headers, layouts/index.redirects), output for the home page.
mediaTypes:
  text/netlify:
    delimiter: ''
    suffixes: ['']
outputFormats:
  headers:
    baseName: _headers
    isPlainText: true
    mediatype: text/netlify
    notAlternative: true
  redirects:
    baseName: _redirects
    isPlainText: true
    mediatype: text/netlify
    notAlternative: true

# Services (Hugo 0.120+)
services:
  googleAnalytics:
    id: ''
  # Feeds carry each item's abstract or summary as plain text (layouts/_default/rss.xml); the 20 newest items.
  rss:
    limit: 20
