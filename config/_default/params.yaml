# SITE SETUP
# Guide: https://wowchemy.com/docs/getting-started/
# Documentation: https://wowchemy.com/docs/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance

appearance:
  theme_day: ''
  theme_night: minimal
  font: minimal
  font_size: L

# SEO

marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'Georgia State University'
    description: 'Benjamin M. Ampel - Assistant Professor of Computer Information Systems at Georgia State University. Research in AI-enabled Cybersecurity, Large Language Models, and Cyber Threat Intelligence.'
    twitter: ''
  analytics:
    google_analytics: 'G-H1EF4V6LP8'
    baidu_tongji: ''
    google_tag_manager: ''
    microsoft_clarity: ''  
  verification:
    google: ''
    baidu: ''

# Site header

header:
  navbar:
    enable: true
    align: l
    show_logo: true
    show_language: false
    show_day_night: false
    show_search: true
    highlight_active_link: true

# Site footer

footer:
  copyright:
    notice: '© {year} Benjamin M. Ampel. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization

locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'
  address_format: en-us

# Site features

features:
  syntax_highlighter:
    theme_light: github-light
    theme_dark: dracula
  math:
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/<username>/<repository>'
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
    giscus:
      repo: ''
      repo_id: ''
      category: ''
      category_id: ''
  search:
    provider: wowchemy
    algolia:
      app_id: ''
      api_key: ''
      index_name: ''
      show_logo: false
  map:
    provider: ''
    api_key: ''
    zoom: 15

# Extensions

extensions:
  academicons:
    enable: true

# Security

security:
  # netlify.toml already sends X-Frame-Options: DENY and frame-ancestors 'none' for every page; true here only stops the
  # generated _headers (layouts/index.headers) from sending the same header a second time.
  allow_frame: true
  # Permissions-Policy line of the generated _headers (the Wowchemy Netlify plugin; its default turns the microphone off).
  # Set to the lab's policy (microphone, autoplay and full screen for this site only) so the generated line can never block
  # the lab's voice answers and sound check. netlify.toml sets the stricter policy for every page outside the lab and
  # explains how the two are combined; keep this value in step with its lab blocks.
  permissions:
    policy: 'accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), usb=(), autoplay=(self), fullscreen=(self)'
