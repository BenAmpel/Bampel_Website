# Fingerprinted site scripts and widget styles (2026-10-24): everything under /js/site/, /js/widgets/ and /css/widgets/
# is written by layouts/partials/functions/js_tag.html, css_tag.html or a fingerprinting resources.Get, so every name
# there carries its content hash. The self-hosted Google Fonts files are named by hash (fonts.css itself is not, and is
# not matched). Vendored libraries live in version-numbered folders, so an update changes the path.
[[headers]]
  for = "/js/site/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/widgets/*"
