[build]
  # Builds are batched to save Netlify build minutes (2026-10-15): a push does not build unless its commit message
  # contains [deploy now]. Ben's Mac publishes waiting changes at 06:00 and 17:00 US Eastern through the
  # "scheduled" build hook (~/.purplelink/bin/netlify-batch-build.sh); hook builds are never skipped by this line.
  ignore = "git log -1 --format=%B | grep -qF '[deploy now]' && exit 1 || exit 0"
  # scripts/lab/build-info.mjs writes the commit being built (COMMIT_REF) into the lab functions, which cannot read it at run time.
  # Dart Sass (Hugo deprecated its built-in libsass in v0.153): the pinned release is downloaded, checked against
  # DART_SASS_SHA256 and unpacked to /tmp, outside the published folder. Hugo finds the `sass` binary on PATH.
  # npm ci installs exactly what package-lock.json pins (and fails if package.json disagrees with it).
  # Two Hugo passes: the first only writes hugo_stats.json (every tag, class and id on the rendered pages) into a scratch folder;
  # the second removes unused rules from css/wowchemy.css with PostCSS and PurgeCSS (postcss.config.js) and writes the site.
  command = "curl -sSfL -o /tmp/dart-sass.tar.gz https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz && printf '%s  %s\\n' ${DART_SASS_SHA256} /tmp/dart-sass.tar.gz | sha256sum -c - && tar -xzf /tmp/dart-sass.tar.gz -C /tmp && export PATH=/tmp/dart-sass:$PATH && npm ci && node scripts/lab/build-info.mjs && npm run build:ccair && hugo --gc --minify --destination \"$(mktemp -d)\" && WC_PURGE_CSS=true hugo --gc --minify --ignoreCache"
  publish = "public"

# Site-wide security headers (added 2026-10-16). HSTS, nosniff and Referrer-Policy come from the _headers file that the
# Wowchemy Netlify plugin generates at build time (its template: modules/wowchemy-plugin-netlify/src/layouts/index.headers,
# one "/*" rule); this block adds the Content-Security-Policy and X-Frame-Options it does not set, and the Permissions-Policy.
#
# How Netlify combines these (checked on bampel.com, 2026-10-22; the Netlify docs do not say): every rule that matches a path
# applies, and for the same header name the later, more specific rule replaces the value instead of adding a second header.
# The plugin's "/*" rule comes first. Evidence: /lab/s/* answers with one Referrer-Policy, "same-origin" from the block below,
# not the plugin's strict-origin-when-cross-origin; /lab/studies/*/admin.html gets Cache-Control from its own block and the
# CSP from /lab/studies/*. So the lab blocks' Permissions-Policy replaces the plugin's. In case that ever changes, the plugin's
# own value is set in config/_default/params.yaml (security.permissions.policy) to the lab's policy, so its _headers line
# never blocks the microphone on lab pages either way; the "/*" block here keeps the stricter policy for the rest of the site.
#
# The dev server (scripts/lab/server.mjs, npm run lab) reads these [[headers]] blocks and sends the same headers for the
# pages it serves; tests/lab/headers.test.mjs checks the lab blocks. Keep each value on one line, in double quotes.
#
# Why each source is listed (inventory taken by loading every page in the sitemap plus /care/ and /lab/ in headless Chrome):
#   script-src  no 'unsafe-inline' (2026-10-24): every script is a file. Shortcode and hook scripts live in assets/js and load
#               fingerprinted with integrity; stylesheets that load late use data-swap + js/css-swap.js instead of onload=.
#               JSON-LD blocks are data, not scripts, so the policy does not apply to them.
#               www.googletagmanager.com (gtag; fonts, Fuse, mark.js, academicons and tsParticles are self-hosted under /fonts/
#               and /vendor/ since 2026-10-24, and Netlify CMS at /admin/ was retired, so jsDelivr is no longer needed), d1bxh8uas1mnw7.cloudfront.net
#               and embed.altmetric.com and api.altmetric.com (Altmetric badges, JSONP), badge.dimensions.ai (Dimensions badges),
#               cdnjs.buymeacoffee.com (support widget).
#               (React for /ccair/ is served from /ccair/vendor/, so unpkg.com is no longer allowed.)
#   style-src   'unsafe-inline': inline <style> blocks and style="" attributes in the same hooks and shortcodes.
#               badge.dimensions.ai, embed.altmetric.com (badge CSS). Fonts and academicons are self-hosted.
#   font-src    'self' (self-hosted Google Fonts and academicons) and data: (icon fonts embedded in the badge CSS).
#   img-src     data: and blob: (inline icons, map and chart canvases), Altmetric badge images, the Buy Me a Coffee widget image,
#               ArcGIS map tiles (Leaflet visitor map), and the Google Analytics and Tag Manager pixels.
#   connect-src Google Analytics collect endpoints, Altmetric and Dimensions metric APIs.
#   frame-src   www.buymeacoffee.com (the support widget iframe).
# Not allowed: any other origin, object/embed, framing of this site by anyone, a changed <base>, form posts to other sites.
# upgrade-insecure-requests: nothing on these pages loads over http:// (checked in the build output, 2026-10-24); the directive
# makes the browser fetch any http:// subresource that slips in later over https:// instead.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    # Pages opened from this site in a new tab, or that open it, cannot reach back into its window object.
    Cross-Origin-Opener-Policy = "same-origin"
    # Speculation rules (static/speculation-rules.json): Chrome and Edge prefetch a same-site page when the pointer rests on a
    # link to it, so the next page opens almost at once. Prefetch only (no prerender, so no page script runs early); the
    # lab and file downloads are excluded. Sent as a header so the CSP needs no inline script.
    Speculation-Rules = "\"/speculation-rules.json\""
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://d1bxh8uas1mnw7.cloudfront.net https://embed.altmetric.com https://api.altmetric.com https://badge.dimensions.ai https://cdnjs.buymeacoffee.com; style-src 'self' 'unsafe-inline' https://badge.dimensions.ai https://embed.altmetric.com; font-src 'self' data:; img-src 'self' data: blob: https://badges.altmetric.com https://cdn.altmetric.com https://cdn.buymeacoffee.com https://server.arcgisonline.com https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://api.altmetric.com https://metrics-api.dimensions.ai https://badge.dimensions.ai; frame-src https://www.buymeacoffee.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

# Self-hosted Lato and React (audit 2026-10-24): these files were answered with "max-age=0, must-revalidate", so every visit
# re-checked them. The Lato files never change under the same name. React is a pinned version; the path would change with it.
[[headers]]
  for = "/speculation-rules.json"
  [headers.values]
    Content-Type = "application/speculationrules+json"

[[headers]]
  for = "/ccair/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ccair/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hugo Pipes bundles (2026-10-24). The production build puts a content hash in each of these names (the theme's md5 or
# sha256 fingerprint), so a changed file always gets a new name and the old one can be cached for a year. Only these
# fingerprinted names are listed: /js/*.js used to hold unhashed site scripts (now in /js/site/, fingerprinted) that kept the
# default revalidation, as do images, data and PDFs.
[[headers]]
  for = "/css/wowchemy.*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

