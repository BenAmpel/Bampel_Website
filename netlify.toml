[build]
  # Builds are batched to save Netlify build minutes (2026-10-15): a push does not build unless its commit message
  # contains [deploy now]. Ben's Mac publishes waiting changes at 06:00 and 17:00 US Eastern through the
  # "scheduled" build hook (~/.purplelink/bin/netlify-batch-build.sh); hook builds are never skipped by this line.
  ignore = "git log -1 --format=%B | grep -qF '[deploy now]' && exit 1 || exit 0"
  # scripts/lab/build-info.mjs writes the commit being built (COMMIT_REF) into the lab functions, which cannot read it at run time.
  command = "npm install && node scripts/lab/build-info.mjs && npm run build:ccair && hugo --gc --minify"
  publish = "public"

# Site-wide security headers (added 2026-10-16). HSTS, nosniff and Referrer-Policy come from the _headers file that the
# Wowchemy Netlify plugin generates at build time (its template: modules/wowchemy-plugin-netlify/src/layouts/index.headers,
# one "/*" rule); this block adds the Content-Security-Policy and X-Frame-Options it does not set, and the Permissions-Policy.
#
# How Netlify combines these (checked on bampel.com, 2026-10-22; the Netlify docs do not say): every rule that matches a path
# applies, and for the same header name the later, more specific rule replaces the value instead of adding a second header.
# The plugin's "/*" rule comes first. Evidence: /lab/s/* answers with one Referrer-Policy, "same-origin" from the block below,
# not the plugin's strict-origin-when-cross-origin; /lab/studies/*/admin.html gets Cache-Control from its own block and the
# CSP from /lab/studies/*. So the lab blocks' Permissions-Policy replaces the plugin's. In case that ever changes, the plugin's
# own value is set in config/_default/params.yaml (security.permissions.policy) to the lab's policy, so its _headers line
# never blocks the microphone on lab pages either way; the "/*" block here keeps the stricter policy for the rest of the site.
#
# The dev server (scripts/lab/server.mjs, npm run lab) reads these [[headers]] blocks and sends the same headers for the
# pages it serves; tests/lab/headers.test.mjs checks the lab blocks. Keep each value on one line, in double quotes.
#
# Why each source is listed (inventory taken by loading every page in the sitemap plus /care/ and /lab/ in headless Chrome):
#   script-src  'unsafe-inline': the theme hooks (layouts/partials/hooks), the shortcodes and the JSON-LD blocks use inline <script>.
#               www.googletagmanager.com (gtag), cdn.jsdelivr.net (tsparticles, typed.js, Fuse, mark.js), d1bxh8uas1mnw7.cloudfront.net
#               and embed.altmetric.com and api.altmetric.com (Altmetric badges, JSONP), badge.dimensions.ai (Dimensions badges),
#               cdnjs.buymeacoffee.com (support widget), identity.netlify.com (Netlify Identity widget the theme loads on the home page).
#               (React for /ccair/ is served from /ccair/vendor/, so unpkg.com is no longer allowed.)
#   style-src   'unsafe-inline': inline <style> blocks and style="" attributes in the same hooks and shortcodes.
#               fonts.googleapis.com (Google Fonts), cdn.jsdelivr.net (academicons), badge.dimensions.ai, embed.altmetric.com.
#   font-src    data: (icon fonts embedded in the Altmetric and Dimensions badge CSS), fonts.gstatic.com (Google Fonts files), cdn.jsdelivr.net (academicons font).
#   img-src     data: and blob: (inline icons, map and chart canvases), Altmetric badge images, the Buy Me a Coffee widget image,
#               ArcGIS map tiles (Leaflet visitor map), and the Google Analytics and Tag Manager pixels.
#   connect-src api.ipify.org (visitor details), Google Analytics collect endpoints, Altmetric and Dimensions metric APIs.
#   frame-src   www.buymeacoffee.com (the support widget iframe).
# Not allowed: any other origin, object/embed, framing of this site by anyone, a changed <base>, form posts to other sites.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.jsdelivr.net https://d1bxh8uas1mnw7.cloudfront.net https://embed.altmetric.com https://api.altmetric.com https://badge.dimensions.ai https://cdnjs.buymeacoffee.com https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://badge.dimensions.ai https://embed.altmetric.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://badges.altmetric.com https://cdn.altmetric.com https://cdn.buymeacoffee.com https://server.arcgisonline.com https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://api.ipify.org https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://api.altmetric.com https://metrics-api.dimensions.ai https://badge.dimensions.ai; frame-src https://www.buymeacoffee.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

# Lab pages (2026-10-22). Each lab block sets a whole Content-Security-Policy: a block's value replaces the site-wide one
# above, so a policy of only "frame-ancestors 'none'" would leave these pages with no script or object limits.
# Inventory (every page under static/lab and the scripts it loads, checked in headless Chrome with zero "Refused to" errors):
#   script-src  'self' only: every lab page loads its scripts from /lab/ (participant.js adds the study type's script and
#               logic.js, also from /lab/). No inline <script>, no inline event handlers, no eval. The one exception is the
#               TraceLab demo (/lab/studies/demo-phishing/), which has an inline script and its own block below.
#   style-src   'unsafe-inline': the pages build their HTML with style="" attributes. Stylesheets are all under /lab/.
#   img-src, media-src  https: because a study's images, audio and video may be any https:// address (the content checks in
#               netlify/lib/lab/types allow that); blob: for media preloaded before a session and for voice recordings played
#               back; data: for small inline images.
#   connect-src 'self' for the lab API (/api/lab/, /api/vc/); participant pages add https: because preloading fetches a
#               study's media files from wherever they are hosted. Admin, sign-in and account pages connect to /api/ only.
#   No fonts from other sites, no frames, no workers, no plugins; never framed; <base> and form posts stay on this site.
# Permissions-Policy: the plugin's default turns the microphone off everywhere, which made voice answers, the AI caller and
# the timing check's sound test fail. Lab study, admin and timing pages allow the microphone, autoplay and full screen for
# this site only (not for anything embedded); everything else stays off. Sign-in and account pages keep the site default.
[[headers]]
  for = "/lab/studies/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; font-src 'self'; frame-src 'none'; worker-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), usb=(), autoplay=(self), fullscreen=(self)"
    X-Robots-Tag = "noindex"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/lab/studies/demo-phishing/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; font-src 'self'; frame-src 'none'; worker-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/lab/studies/*/admin.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self'; font-src 'self'; frame-src 'none'; worker-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/lab/s/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; font-src 'self'; frame-src 'none'; worker-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), usb=(), autoplay=(self), fullscreen=(self)"
    X-Robots-Tag = "noindex"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/lab/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self'; font-src 'self'; frame-src 'none'; worker-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), usb=(), autoplay=(self), fullscreen=(self)"
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# The timing self-check measures the speaker-to-microphone delay, so it needs the microphone too. Nothing is sent from it.
[[headers]]
  for = "/lab/timing/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self'; font-src 'self'; frame-src 'none'; worker-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), usb=(), autoplay=(self), fullscreen=(self)"
    X-Robots-Tag = "noindex"
    Referrer-Policy = "same-origin"

# Researcher sign-in and account pages: never framed, not indexed, no referrer, not cached. (The invitation token is in the
# address fragment, which browsers never send to a server or in a referrer; the page also removes it from the address bar.)
[[headers]]
  for = "/lab/signin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-src 'none'; worker-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/lab/account/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-src 'none'; worker-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# Lab engine: every study is served by one participant page and one admin page, which read the study ID
# from the address (/lab/s/<study>, /lab/admin/<study>).
[[redirects]]
  from = "/lab/s/*"
  to = "/lab/s/index.html"
  status = 200

[[redirects]]
  from = "/lab/admin/*"
  to = "/lab/admin/index.html"
  status = 200

[build.environment]
  HUGO_VERSION = "0.148.2"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"
  NODE_VERSION = "22"

# The center was briefly called CARE (/care/) in June 2026; it is CCAIR again (Oct 2026).
# Send old /care/ links to /ccair/.
[[redirects]]
  from = "/care/*"
  to = "/ccair/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/care"
  to = "/ccair/"
  status = 301
  force = true

